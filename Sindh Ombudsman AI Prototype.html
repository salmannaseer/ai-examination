document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ont-family: var(--font-heading); font-weight: 800; font-size: 13px; width: 22px; color: var(--color-accent)\">03<\/span>\n        <h3 style=\"margin: 0; flex: 1\">Draft Decision with AI<\/h3>\n        <sc-if value=\"{{ draftSummary }}\" hint-placeholder-val=\"{{ false }}\">\n          <span class=\"tag tag-accent\">{{ draftSummary }}<\/span>\n        <\/sc-if>\n        <span class=\"text-muted\" style=\"font-size: 12px; width: 54px; text-align: right\">{{ label3 }}<\/span>\n      <\/div>\n      <sc-if value=\"{{ open3 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding: 0 0 36px 38px\">\n        <div class=\"field\">\n          <label>Final Decision / Directions <span style=\"color: #c2410c\">*<\/span><\/label>\n          <textarea class=\"input\" style=\"min-height: 130px\" value=\"{{ decisionDirections }}\" sc-camel-on-change=\"{{ on_decisionDirections }}\" placeholder=\"A few final lines stating the intended outcome and any directions to the agency\"><\/textarea>\n          <p class=\"text-muted\" style=\"font-size: 12px; margin: 8px 0 0\">These lines are authoritative. The AI may improve language and structure but must not change the substantive outcome.<\/p>\n        <\/div>\n\n        <div style=\"margin-top: 24px; border: 1px solid #e4e8ec; border-radius: 8px; padding: 14px 16px; background: #fafbfc\">\n          <h6 style=\"margin: 0 0 10px\">Context carried into this request<\/h6>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n            <sc-for list=\"{{ draftContext }}\" as=\"c\" hint-placeholder-count=\"4\">\n              <span class=\"tag tag-neutral\">{{ c }}<\/span>\n            <\/sc-for>\n          <\/div>\n        <\/div>\n\n        <sc-if value=\"{{ draftError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top: 24px; padding: 12px 14px; background: #fdf0ec; border-left: 3px solid #c2410c; font-size: 13px; color: #8a2c0c; border-radius: 6px\">{{ draftError }}<\/div>\n        <\/sc-if>\n\n        <div style=\"display: flex; align-items: center; gap: 16px; margin-top: 28px\">\n          <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ runDraft }}\" disabled=\"{{ draftBusy }}\">{{ draftButtonLabel }}<\/button>\n          <sc-if value=\"{{ draftBusy }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"flex: 1; max-width: 260px\">\n              <div class=\"text-muted\" style=\"font-size: 12px; margin-bottom: 6px\">Generating Draft Decision\u2026<\/div>\n              <div style=\"height: 2px; background: var(--color-neutral-300); overflow: hidden\"><div style=\"height: 2px; width: 33%; background: #0f7b53; animation: bar 1.1s linear infinite\"><\/div><\/div>\n            <\/div>\n          <\/sc-if>\n        <\/div>\n\n        <sc-if value=\"{{ draftDone }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top: 36px; border-top: 1px solid #e4e8ec; padding-top: 24px\">\n          <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 14px\">\n            <h6 style=\"margin: 0\">Generated Draft Decision<\/h6>\n            <span class=\"tag tag-accent\">AI-generated \u2014 editable<\/span>\n            <sc-if value=\"{{ draftEdited }}\" hint-placeholder-val=\"{{ false }}\">\n              <span class=\"tag tag-neutral\">Edited by user<\/span>\n            <\/sc-if>\n          <\/div>\n          <div style=\"display: flex; gap: 4px; border: 1px solid #d8dee4; border-bottom: 0; border-radius: 6px 6px 0 0; padding: 6px; background: #f4f6f8\">\n            <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ cmdBold }}\" style=\"font-family: var(--font-heading)\">B<\/button>\n            <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ cmdItalic }}\" style=\"font-style: italic\">I<\/button>\n            <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ cmdHeading }}\">Heading<\/button>\n            <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ cmdList }}\">List<\/button>\n          <\/div>\n          <div class=\"rt\" style=\"min-height: 340px\" sc-camel-content-editable=\"{{ true }}\" sc-camel-suppress-content-editable-warning=\"{{ true }}\" ref=\"{{ draftRef }}\" sc-camel-on-input=\"{{ onDraftInput }}\" sc-camel-on-focus=\"{{ setEditorDraft }}\"><\/div>\n          <div style=\"display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap\">\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ runDraft }}\">Regenerate Draft<\/button>\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ copyDraft }}\">Copy Draft<\/button>\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ clearDraft }}\">Clear<\/button>\n          <\/div>\n        <\/div>\n        <\/sc-if>\n      <\/div>\n      <\/sc-if>\n    <\/div>\n  <\/div>\n  <\/sc-if>\n\n  <sc-if value=\"{{ onSettings }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"max-width: 1180px; margin: 0 auto; padding: 28px 32px 0\">\n    <div class=\"card-surface\" style=\"padding: 22px 26px; margin-bottom: 16px\">\n      <h1 style=\"font-size: 26px; margin: 0 0 6px\">AI Settings<\/h1>\n      <p class=\"text-muted\" style=\"font-size: 14px; margin: 0\">Configure the API connection and tune the instructions used for each AI use case. Changes affect future requests only.<\/p>\n    <\/div>\n\n    <div class=\"card-surface\" style=\"padding: 24px 26px\">\n    <h4 style=\"margin: 0 0 4px\">API Configuration<\/h4>\n    <p class=\"text-muted\" style=\"font-size: 13px; margin: 0 0 14px\">Requests are sent from this browser straight to the selected provider using the key below.<\/p>\n    <div style=\"display: flex; align-items: center; gap: 10px; padding: 11px 14px; margin-bottom: 20px; border-radius: 8px; background: {{ engineBg }}; border: 1px solid {{ engineBorder }}; font-size: 13px\">\n      <strong style=\"font-weight: 600\">Active engine<\/strong>\n      <span>{{ engineLine }}<\/span>\n    <\/div>\n    <div class=\"ov\">\n      <div class=\"field\">\n        <label>AI Provider<\/label>\n        <sc-raw-select class=\"input\" value=\"{{ provider }}\" sc-camel-on-change=\"{{ on_provider }}\">\n          <option value=\"GPT-5.4 mini (OpenAI)\">GPT-5.4 mini (OpenAI)<\/option>\n          <option value=\"GPT-4o mini (OpenAI)\">GPT-4o mini (OpenAI)<\/option>\n          <option value=\"DeepSeek-V4-Flash (DeepSeek)\">DeepSeek-V4-Flash (DeepSeek)<\/option>\n          <option value=\"DeepSeek Chat (DeepSeek)\">DeepSeek Chat (DeepSeek)<\/option>\n        <\/sc-raw-select>\n      <\/div>\n      <div class=\"field\">\n        <label>API Endpoint<\/label>\n        <input class=\"input\" value=\"{{ endpoint }}\" sc-camel-on-change=\"{{ on_endpoint }}\">\n      <\/div>\n      <div class=\"field\">\n        <label>API Key<\/label>\n        <div style=\"display: flex; gap: 8px\">\n          <input class=\"input\" type=\"{{ keyInputType }}\" value=\"{{ keyFieldValue }}\" sc-camel-on-change=\"{{ on_apiKey }}\" placeholder=\"sk-\u2026\">\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ toggleReveal }}\">{{ revealLabel }}<\/button>\n        <\/div>\n        <p class=\"text-muted\" style=\"font-size: 11px; margin: 6px 0 0\">Sent directly from this browser to the provider over HTTPS. Never stored or transmitted anywhere else.<\/p>\n      <\/div>\n      <div class=\"field\">\n        <label>Model ID<\/label>\n        <input class=\"input\" value=\"{{ model }}\" sc-camel-on-change=\"{{ on_model }}\">\n        <p class=\"text-muted\" style=\"font-size: 11px; margin: 6px 0 0\">Exact ID sent to the provider. Correct it if your account names the model differently.<\/p>\n      <\/div>\n      <div class=\"field\">\n        <label>Organization / Project ID <span class=\"text-muted\">optional<\/span><\/label>\n        <input class=\"input\" value=\"{{ orgId }}\" sc-camel-on-change=\"{{ on_orgId }}\">\n      <\/div>\n      <div class=\"field\">\n        <label>Request Timeout (seconds)<\/label>\n        <input class=\"input\" value=\"{{ timeout }}\" sc-camel-on-change=\"{{ on_timeout }}\">\n      <\/div>\n      <div class=\"field\">\n        <label>Maximum Output Tokens <span class=\"text-muted\">optional<\/span><\/label>\n        <input class=\"input\" value=\"{{ maxTokens }}\" sc-camel-on-change=\"{{ on_maxTokens }}\">\n      <\/div>\n      <div class=\"field\">\n        <label>Model Parameters <span class=\"text-muted\">optional<\/span><\/label>\n        <input class=\"input\" value=\"{{ modelParams }}\" sc-camel-on-change=\"{{ on_modelParams }}\" placeholder=\"temperature=0.2, top_p=1\">\n      <\/div>\n    <\/div>\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-top: 24px; flex-wrap: wrap\">\n      <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ testConnection }}\" disabled=\"{{ testBusy }}\">{{ testLabel }}<\/button>\n      <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ saveConfig }}\">Save Configuration<\/button>\n      <span class=\"text-muted\" style=\"font-size: 12px\">API Status<\/span>\n      <span class=\"{{ statusTagClass }}\">{{ apiStatus }}<\/span>\n      <sc-if value=\"{{ apiStatusDetail }}\" hint-placeholder-val=\"{{ false }}\">\n        <span class=\"text-muted\" style=\"font-size: 12px\">{{ apiStatusDetail }}<\/span>\n      <\/sc-if>\n    <\/div>\n    <\/div>\n\n    <div class=\"card-surface\" style=\"padding: 24px 26px; margin-top: 16px\">\n    <h4 style=\"margin: 0 0 4px\">Document Extraction Server<\/h4>\n    <p class=\"text-muted\" style=\"font-size: 13px; margin: 0 0 14px\">Offload PDF, DOCX, TXT, and JPG/PNG extraction to a server (supports deep text parsing and OCR).<\/p>\n    <div class=\"ov\">\n      <div class=\"field wide\">\n        <label>Extraction Server Endpoint<\/label>\n        <div style=\"display: flex; gap: 8px\">\n          <input class=\"input\" value=\"{{ serverUrl }}\" sc-camel-on-change=\"{{ on_serverUrl }}\" placeholder=\"http://localhost:8000\">\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ testServer }}\" disabled=\"{{ serverBusy }}\">{{ serverTestLabel }}<\/button>\n        <\/div>\n        <p class=\"text-muted\" style=\"font-size: 11px; margin: 6px 0 0\">Default: http://localhost:8000 (Python FastAPI server). If server is offline, client-side fallback is used automatically.<\/p>\n      <\/div>\n    <\/div>\n    <div style=\"display: flex; align-items: center; gap: 12px; margin-top: 16px; flex-wrap: wrap\">\n      <span class=\"text-muted\" style=\"font-size: 12px\">Server Status<\/span>\n      <span class=\"{{ serverStatusTagClass }}\">{{ serverStatus }}<\/span>\n      <sc-if value=\"{{ serverStatusDetail }}\" hint-placeholder-val=\"{{ false }}\">\n        <span class=\"text-muted\" style=\"font-size: 12px\">{{ serverStatusDetail }}<\/span>\n      <\/sc-if>\n    <\/div>\n    <\/div>\n\n    <div class=\"card-surface\" style=\"padding: 24px 26px; margin-top: 16px\">\n    <h4 style=\"margin: 0 0 4px\">Global AI Instructions<\/h4>\n    <p class=\"text-muted\" style=\"font-size: 13px; margin: 0 0 16px\">Applied to all three AI use cases.<\/p>\n    <textarea class=\"input\" style=\"min-height: 230px; font-size: 13px; line-height: 1.6\" value=\"{{ globalInstructions }}\" sc-camel-on-change=\"{{ on_globalInstructions }}\"><\/textarea>\n    <div style=\"display: flex; gap: 8px; margin-top: 12px\">\n      <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ saveInstructions }}\">Save Instructions<\/button>\n      <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ resetGlobal }}\">Reset to Default<\/button>\n    <\/div>\n    <\/div>\n\n    <div class=\"card-surface\" style=\"padding: 24px 26px; margin-top: 16px\">\n    <h4 style=\"margin: 0 0 16px\">Use Case Instructions<\/h4>\n    <div style=\"display: flex; gap: 0; border-bottom: 1px solid #e4e8ec; margin-bottom: 24px\">\n      <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n        <button class=\"btn\" sc-camel-on-click=\"{{ t.select }}\" style=\"{{ t.style }}\">{{ t.label }}<\/button>\n      <\/sc-for>\n    <\/div>\n\n    <div style=\"display: grid; grid-template-columns: 280px 1fr; gap: 32px; align-items: start\">\n      <div>\n        <h6 style=\"margin: 0 0 10px\">Available Input Context<\/h6>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n          <sc-for list=\"{{ tabVars }}\" as=\"v\" hint-placeholder-count=\"6\">\n            <span class=\"tag tag-neutral\" style=\"font-family: ui-monospace, monospace; font-size: 11px\">{{ v }}<\/span>\n          <\/sc-for>\n        <\/div>\n        <h6 style=\"margin: 28px 0 10px\">Expected Output<\/h6>\n        <div style=\"border: 1px solid #e4e8ec; border-radius: 8px; overflow: hidden\">\n          <sc-for list=\"{{ tabOutputs }}\" as=\"o\" hint-placeholder-count=\"4\">\n            <div style=\"padding: 9px 12px; font-size: 13px; border-bottom: 1px solid #e4e8ec\">{{ o }}<\/div>\n          <\/sc-for>\n        <\/div>\n        <p class=\"text-muted\" style=\"font-size: 11px; margin: 10px 0 0\">Read-only. Input variables are system-controlled.<\/p>\n      <\/div>\n      <div>\n        <h6 style=\"margin: 0 0 10px\">{{ tabInstructionsLabel }}<\/h6>\n        <textarea class=\"input\" style=\"min-height: 420px; font-size: 13px; line-height: 1.6\" value=\"{{ tabInstructions }}\" sc-camel-on-change=\"{{ on_tabInstructions }}\"><\/textarea>\n        <div style=\"display: flex; gap: 8px; margin-top: 12px\">\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ resetTab }}\">Reset to Default<\/button>\n          <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ saveInstructions }}\">Save Configuration<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n    <\/div>\n  <\/div>\n  <\/sc-if>\n  <\/div>\n\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--color-text); color: var(--color-bg); padding: 10px 18px; font-size: 13px; z-index: 50\">{{ toast }}<\/div>\n  <\/sc-if>\n<\/div>\n\n\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showModelBadge&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Prototype&quot;}}\">\nconst DEFAULTS = {\n  global: `You are assisting officers of the Provincial Ombudsman Sindh in analyzing administrative complaint records.\nBase your response solely on information supplied through the application.\nDo not fabricate facts, dates, names, documents, proceedings, evidence, quotations, legal provisions, or conclusions.\nMaintain a formal, neutral, factual, and professional administrative tone.\nClearly identify incomplete or conflicting information where relevant.\nAI-generated content is advisory and will be reviewed by an authorized officer before use.`,\n  examination: `Analyze the complaint information and supporting documents provided. Based solely on the supplied information, assist the Investigation Staff in examining the complaint.\n\nRecommend one of the following outcomes:\nMay be Admitted\nMay be Not Admitted\nMay be Forwarded\nMay be Deferred\n\nProvide clear Examination Remarks explaining the basis for the recommendation.\nDo not invent facts, laws, dates, evidence, parties, or circumstances that are not contained in the supplied information.\nIf the available information is insufficient, clearly identify what information is missing.\n\nAlso generate:\nA notification for the complainant regarding the admissibility outcome, not exceeding 200 characters.\nA message for the Investigation Officer regarding the outcome or required next action, not exceeding 200 characters.\n\nReturn the recommendation, Examination Remarks, complainant notification, and Investigation Officer message as separate outputs.`,\n  findings: `Analyze the complaint information, examination information, investigation details, supporting documents, and file descriptions provided.\nPrepare structured Findings based strictly on the available record.\n\nGenerate the response under exactly the following headings:\n\nBackground\nSummarize the complaint, relevant parties, grievance, subject matter, and factual context.\n\nAdmissibility\nSummarize the admissibility position and relevant examination considerations.\n\nInvestigation\nSummarize the investigation undertaken, including important correspondence, responses, records, evidence, and other relevant material.\n\nFindings\nAnalyze the available evidence and records and identify the material findings. Clearly distinguish supported facts from assertions made by the parties.\n\nConclusion\nProvide a concise conclusion based on the preceding Findings.\n\nDo not fabricate facts, dates, proceedings, evidence, documents, legal provisions, or conclusions that cannot reasonably be derived from the supplied information.\nWhere records conflict, identify the conflict rather than treating unsupported information as established fact.\nWhere information is insufficient, clearly state the limitation.`,\n  decision: `Prepare a detailed draft decision using only the complaint information, investigation records, finalized Findings, and decision directions supplied.\n\nGenerate the response under exactly the following headings:\n\n1. Complaint\nProvide a concise but sufficiently detailed summary of the complaint, including the grievance, relevant background, parties, and material facts.\n\n2. Proceedings\nProvide a bullet-point summary of the material investigation proceedings. Derive these proceedings from the investigation details, uploaded investigation records, and their descriptions.\nPresent proceedings chronologically wherever the available record permits.\nDo not create proceedings that are unsupported by the supplied record.\n\n3. Findings\nProvide a concise decision-oriented summary of the finalized Findings. Do not reproduce the complete Findings text unnecessarily.\n\n4. Decision\nDraft the final Decision based on the user's supplied decision directions.\nThe user's decision directions represent the intended substantive outcome and must take precedence over any AI interpretation.\nYou may improve language, organization, professional tone, readability, and continuity, but must not materially alter the intended outcome or directions.\n\nDo not invent facts, proceedings, documents, dates, evidence, laws, orders, directions, or parties that are absent from the supplied record.`\n};\n\nconst TAB_META = {\n  examination: {\n    label: 'Examination',\n    vars: ['{{complaint_type}}', '{{regional_office}}', '{{complainant_name}}', '{{province}}', '{{district}}', '{{taluka}}', '{{complaint_subject}}', '{{complaint_details}}', '{{complaint_files}}'],\n    outputs: ['Recommendation', 'Examination Remarks', 'Complainant Notification', 'Investigation Officer Message']\n  },\n  findings: {\n    label: 'Findings',\n    vars: ['{{complaint_type}}', '{{regional_office}}', '{{complainant_name}}', '{{province}}', '{{district}}', '{{taluka}}', '{{complaint_subject}}', '{{complaint_details}}', '{{complaint_files}}', '{{examination_recommendation}}', '{{examination_remarks}}', '{{investigation_details}}', '{{investigation_files}}', '{{investigation_file_descriptions}}'],\n    outputs: ['Background', 'Admissibility', 'Investigation', 'Findings', 'Conclusion']\n  },\n  decision: {\n    label: 'Draft Decision',\n    vars: ['{{complaint_type}}', '{{regional_office}}', '{{complainant_name}}', '{{province}}', '{{district}}', '{{taluka}}', '{{complaint_subject}}', '{{complaint_details}}', '{{complaint_files}}', '{{investigation_details}}', '{{investigation_files}}', '{{investigation_file_descriptions}}', '{{final_findings}}', '{{decision_directions}}'],\n    outputs: ['1. Complaint', '2. Proceedings', '3. Findings', '4. Decision']\n  }\n};\n\nconst PROVIDERS = {\n  'GPT-5.4 mini (OpenAI)': { endpoint: 'https://api.openai.com/v1/chat/completions', model: 'gpt-5.4-mini' },\n  'GPT-4o mini (OpenAI)': { endpoint: 'https://api.openai.com/v1/chat/completions', model: 'gpt-4o-mini' },\n  'DeepSeek-V4-Flash (DeepSeek)': { endpoint: 'https://api.deepseek.com/v1/chat/completions', model: 'deepseek-v4-flash' },\n  'DeepSeek Chat (DeepSeek)': { endpoint: 'https://api.deepseek.com/v1/chat/completions', model: 'deepseek-chat' }\n};\n\nclass Component extends DCLogic {\n  state = {\n    page: 'process', open: 1,\n    complaintType: '', regionalOffice: '', complainantName: '', province: 'Sindh', district: '', taluka: '',\n    complaintSubject: '', complaintDetails: '', complaintFiles: [],\n    examStatus: 'idle', examError: '', examEdited: false,\n    recommendation: '', remarks: '', notify: '', ioMessage: '',\n    investigationDetails: '', invFiles: [],\n    findingsStatus: 'idle', findingsError: '', findingsHtml: '', findingsVersion: 0, findingsEdited: false,\n    decisionDirections: '', draftStatus: 'idle', draftError: '', draftHtml: '', draftVersion: 0, draftEdited: false,\n    provider: 'GPT-4o mini (OpenAI)', endpoint: PROVIDERS['GPT-4o mini (OpenAI)'].endpoint, apiKey: '', apiKeySaved: false, reveal: false,\n    model: PROVIDERS['GPT-4o mini (OpenAI)'].model, orgId: '', timeout: '60', maxTokens: '4000', modelParams: 'temperature=0.2',\n    apiStatus: 'Not Tested', apiStatusDetail: '', testBusy: false,\n    globalInstructions: DEFAULTS.global,\n    instructions: { examination: DEFAULTS.examination, findings: DEFAULTS.findings, decision: DEFAULTS.decision },\n    tab: 'examination', toast: '', activeEditor: 'findings',\n    serverUrl: 'http://localhost:8000', serverStatus: 'Not Tested', serverStatusDetail: '', serverBusy: false\n  };\n\n  findingsRef = React.createRef();\n  draftRef = React.createRef();\n  _fv = 0; _dv = 0;\n\n  componentDidUpdate() { this.syncEditors(); }\n  componentDidMount() {\n    this.syncEditors();\n    this.loadPersistedSettings();\n  }\n\n    persistSettings(saveToLocal=true) {\n    try {\n
